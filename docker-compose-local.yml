services:
  db:
    image: mysql:8.0
    container_name: db_local
    restart: always
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - ./db_data_local:/var/lib/mysql
    networks:
      - daebbang_local

  redis:
    image: redis:latest
    container_name: redis_local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - daebbang_local

networks:
  daebbang_local:
    driver: bridge