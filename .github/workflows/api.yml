name: API Server CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'daebbang-api/**'
      - 'daebbang-core/**'
      - 'daebbang-common/**'
      - '.github/workflows/api.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

        # Java 17 Setting (Gradle Cache)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

        # Gradle Settings
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

        # Gradle Build (API)
      - name: Build Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew :daebbang-api:clean :daebbang-api:build

        # Jar file Extract
      - name: Extract Jar Layers
        run: |
          cp daebbang-api/build/libs/*.jar daebbang-api/build/libs/api.jar
          cd daebbang-api/build/libs
          java -Djarmode=tools -jar api.jar extract --layers --launcher

        # Docker Buildx Settings
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # Docker Login
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

        # Docker Registry Push
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./daebbang-api/build/libs/api
          file: ./daebbang-api/Dockerfile-prod
          push: 'true'
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/daebbang-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

        # Docker Scout
      - name: Docker Scout
        uses: docker/scout-action@v1
        with:
          command: quickview,cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/daebbang-server:latest
          exit-code: true
          only-severities: critical, high