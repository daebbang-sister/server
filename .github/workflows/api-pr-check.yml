name: API Server PR Check
on:
  pull_request:
    types: [ "opened", "synchronize", "reopened" ]
    branches: [ "main" ]
    paths:
      - 'daebbang-api/**'
      - 'daebbang-core/**'
      - 'daebbang-common/**'
      - '.github/workflows/api.yml'
      - '.github/workflows/api-pr-check.yml'

jobs:
  api-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run Tests
        run: |
          chmod +x ./gradlew
          ./gradlew :daebbang-api:clean :daebbang-api:test
