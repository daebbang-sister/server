spring:
  application:
    name: daebbang-api

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

  flyway:
    enabled: false

  jwt:
    secret: "daebbang_sister_test_secret_key_test_information_at_least_32_chars"
    access: 600000
    refresh: 604800000

  cors:
    origins: http://localhost:8080

  sms:
    client-id: ertsgsdfgsdfgfs
    client-secret: sdfgsdfgsdfgsdf
    sender: 010-1234-5678

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@test.com
    password: "daebbang_sister_test_secret_app_key"
    properties:
      mail:
        smtp:
          timeout: 5000
          auth: true
          starttls:
            enable: true

  oauth2:
    failure: http://localhost:3000/login?error
    success: http://localhost:3000

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: test-kakao-client-id
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-secret: test-kakao-client-secret
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id