spring:
  application:
    name: daebbang-api

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${MYSQL_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  jwt:
    secret: ${SECRET_KEY}
    access: ${ACCESS_EXPIRATION}
    refresh: ${REFRESH_EXPIRATION}