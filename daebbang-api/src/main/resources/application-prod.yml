spring:
  application:
    name: daebbang-api

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${MYSQL_DATABASE}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: "classpath:db/migration"

  jwt:
    secret: ${SECRET_KEY}
    access: ${ACCESS_EXPIRATION}
    refresh: ${REFRESH_EXPIRATION}

  sms:
    client-id: ${SMS_REST_API_KEY}
    client-secret: ${SMS_SECRET_KEY}
    sender: ${SENDER}

  mail:
    host: smtp.gmail.com
    port: ${MAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

  cors:
    origins: ${LOCAL_SERVER}, ${DOMAIN_SERVER}, ${ADMIN_SERVER}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: ${KAKAO_REST_API_KEY}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-secret: ${KAKAO_SECRET_KEY}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  oauth2:
    success: ${OAUTH2_SUCCESS_URI}
    failure: ${OAUTH2_FAILED_URI}

  app:
    cookie:
      secure: ${COOKIE_SECURE}
      same-site: ${COOKIE_SAME_SITE}
      domain: ${COOKIE_DOMAIN}
      maxAge: ${COOKIE_MAX_AGE}

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_S3_REGION}
      s3:
        bucket: ${AWS_S3_BUCKET}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}