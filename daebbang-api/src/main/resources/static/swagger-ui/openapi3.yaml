                user/get-my-info-edit-local:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"id\":null,\"provider\":\"LOCAL\",\"loginId\"\
                    :\"testuser\",\"userName\":\"홍길동\",\"userEmail\":\"test@example.com\"\
                    ,\"userPhoneNumber\":\"010-1234-5678\"}}"
  /v1/orders/{orderNumber}/cancel/partial:
    post:
      tags:
      - Order
      summary: 주문 부분 취소 - 항목 미선택
      description: orderDetailIds가 비어있으면 400 Bad Request를 반환합니다.
