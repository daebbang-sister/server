                products/main-new:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[{\"id\":1,\"categoryName\":\"TOP\",\"productName\"\
                    :\"루즈핏 티셔츠\",\"mainImageUrl\":\"http://example.com/main1.jpg\"\
                    ,\"hoverImageUrl\":\"http://example.com/hover1.jpg\",\"originalPrice\"\
                    :50000,\"sellingPrice\":40000,\"discountRate\":20,\"colorCodes\"\
                    :[\"#000000\",\"#FFFFFF\"]},{\"id\":2,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"오버핏 니트\",\"mainImageUrl\":\"http://example.com/main2.jpg\"\
                    ,\"hoverImageUrl\":null,\"originalPrice\":39000,\"sellingPrice\"\
                    :39000,\"discountRate\":null,\"colorCodes\":[\"#8B5A2B\"]}]}"
                products/main-new-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
