openapi: 3.0.1
info:
  title: 대빵 언니 API 서버 API 명세서
  description: 대빵 언니 API 서버 명세서입니다.
  version: 1.0.0
servers:
- url: https://api.daebbang-sister.shop
  description: 운영 서버
- url: http://localhost:8080
  description: 로컬 개발 서버
tags: []
paths:
  /v1/carts:
    get:
      tags:
      - Cart
      summary: 장바구니 조회
      description: 로그인한 회원의 장바구니를 커서 기반 페이지네이션으로 조회합니다. cursor 생략 시 최신 항목부터 반환합니다.
      operationId: cart/get-carts-
      parameters:
      - name: cursor
        in: query
        description: 마지막으로 조회한 cartId (첫 페이지 요청 시 생략)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (기본값: 8)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartPageResponse'
              examples:
                cart/get-carts-first-page:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"carts\":[{\"cartId\":10,\"quantity\":1,\"productName\"\
                    :\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\":30000,\"\
                    discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"mainImageUrl\"\
                    :\"https://example.com/image.jpg\"},{\"cartId\":9,\"quantity\"\
                    :1,\"productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :8,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":7,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":6,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":5,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":4,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":3,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    }],\"nextCursor\":3,\"hasNext\":true}}"
                cart/get-carts-last-page:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"carts\":[{\"cartId\":3,\"quantity\":1,\"productName\"\
                    :\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\":30000,\"\
                    discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"mainImageUrl\"\
                    :\"https://example.com/image.jpg\"},{\"cartId\":2,\"quantity\"\
                    :1,\"productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :1,\"quantity\":1,\"productName\":\"테스트 상품\",\"originalPrice\"\
                    :30000,\"discountPrice\":30000,\"discountRate\":null,\"color\"\
                    :\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    }],\"nextCursor\":null,\"hasNext\":false}}"
    post:
      tags:
      - Cart
      summary: 장바구니 추가
      description: 장바구니에 상품을 추가합니다. 이미 담긴 상품이면 수량을 합산합니다. 단건 또는 다건 모두 리스트 형태로 전달합니다.
      operationId: cart/save-carts
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/CartSaveRequest'
            examples:
              cart/save-carts:
                value: "[{\"productDetailId\":1,\"quantity\":2}]"
              cart/save-carts-invalid-quantity:
                value: "[{\"productDetailId\":1,\"quantity\":0}]"
              cart/save-carts-multiple:
                value: "[{\"productDetailId\":1,\"quantity\":2},{\"productDetailId\"\
                  :2,\"quantity\":1},{\"productDetailId\":3,\"quantity\":3}]"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/save-carts:
                  value: "{\"success\":true,\"status\":201,\"message\":\"장바구니 추가에\
                    \ 성공하였습니다.\",\"data\":null}"
                cart/save-carts-multiple:
                  value: "{\"success\":true,\"status\":201,\"message\":\"장바구니 추가에\
                    \ 성공하였습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cart/save-carts-invalid-quantity:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"quantity\",\"message\"\
                    :\"수량은 최소 한 개 이상 선택해야 합니다.\"}]}"
    delete:
      tags:
      - Cart
      summary: 장바구니 선택 삭제
      description: 선택한 장바구니 항목들을 삭제합니다. 본인 소유 항목만 삭제됩니다.
      operationId: cart/delete-carts
      parameters:
      - name: ids
        in: query
        description: 삭제할 장바구니 항목 ID 목록 (1개 이상)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/delete-carts:
                  value: "{\"success\":true,\"status\":200,\"message\":\"장바구니 삭제에\
                    \ 성공하였습니다.\",\"data\":null}"
  /v1/logout:
    delete:
      tags:
      - Auth
      summary: 로그아웃
      description: "로그아웃 요청 시 access token 블랙리스트 등록, refresh token Redis 삭제, refresh\
        \ 쿠키 만료 처리가 수행됩니다."
      operationId: auth/logout
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                auth/logout:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
                auth/logout-no-access-token:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
                auth/logout-no-refresh-cookie:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
  /v1/users:
    get:
      tags:
      - User
      summary: 회원 정보 조회
      description: JWT 토큰으로 인증된 회원의 정보를 조회합니다.
      operationId: user/get-user
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰 (로그인 후 발급된 액세스 토큰)
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              examples:
                user/get-user:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"id\":1,\"provider\":\"LOCAL\",\"loginId\"\
                    :\"testuser\",\"userName\":\"홍길동\",\"userEmail\":\"test@example.com\"\
                    ,\"userPhoneNumber\":\"010-****-5678\",\"createdAt\":\"2025-01-01T00:00:00\"\
                    ,\"lastLoginAt\":null}}"
    post:
      tags:
      - User
      summary: 회원 가입
      description: 새로운 회원을 등록합니다. 전화번호 인증 완료 후 가입이 가능합니다.
      operationId: user/join-user
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/JoinUserRequest'
            examples:
              user/join-user:
                value: "{\"name\":\"홍길동\",\"loginId\":\"testuser123\",\"password\"\
                  :\"Password123!\",\"phoneNumber\":\"010-1234-5678\",\"email\":\"\
                  test@example.com\",\"address\":{\"alias\":null,\"zipCode\":\"123-4567\"\
                  ,\"address\":\"테스트시 테스트구 테스트동\",\"detailAddress\":\"테스트 오피스텔 2층\"\
                  }}"
              user/join-user-invalid-login-id:
                value: "{\"name\":\"홍길동\",\"loginId\":\"TestUser123\",\"password\"\
                  :\"Password123!\",\"phoneNumber\":\"010-1234-5678\",\"email\":\"\
                  test@example.com\",\"address\":{\"alias\":null,\"zipCode\":\"123-4567\"\
                  ,\"address\":\"테스트시 테스트구 테스트동\",\"detailAddress\":\"테스트 오피스텔 2층\"\
                  }}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                user/join-user:
                  value: "{\"success\":true,\"status\":201,\"message\":\"회원 가입에 성공\
                    하였습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user/join-user-invalid-login-id:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"loginId\",\"message\"\
                    :\"아이디는 영문 소문자와 숫자만 입력 가능하며, 특수문자는 사용할 수 없습니다.\"}]}"
  /v1/carts/all:
    delete:
      tags:
      - Cart
      summary: 장바구니 전체 삭제
      description: 로그인한 회원의 장바구니를 전체 삭제합니다.
      operationId: cart/delete-all-carts
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/delete-all-carts:
                  value: "{\"success\":true,\"status\":200,\"message\":\"장바구니 삭제에\
                    \ 성공하였습니다.\",\"data\":null}"
  /v1/carts/{cartId}:
    patch:
      tags:
      - Cart
      summary: 장바구니 수정
      description: 장바구니 항목의 색상/사이즈(productDetailId)와 수량을 수정합니다.
      operationId: cart/update-cart
      parameters:
      - name: cartId
        in: path
        description: 수정할 장바구니 항목 ID
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/CartUpdateRequest'
            examples:
              cart/update-cart:
                value: "{\"productDetailsId\":2,\"quantity\":3}"
              cart/update-cart-not-found:
                value: "{\"productDetailsId\":2,\"quantity\":3}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/update-cart:
                  value: "{\"success\":true,\"status\":200,\"message\":\"장바구니 수정에\
                    \ 성공하였습니다.\",\"data\":null}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cart/update-cart-not-found:
                  value: "{\"success\":false,\"status\":404,\"message\":\"존재하지 않는\
                    \ 카트 번호입니다.\",\"data\":null}"
  /v1/products/new:
    get:
      tags:
      - Product
      summary: 신상품 전체 페이지 조회
      description: 신상품 전체 페이지를 조회합니다. 등록일 기준 최신순으로 반환되며 페이징이 적용됩니다.
      operationId: products/new
      parameters:
      - name: direction
        in: query
        description: "정렬 방향 (ASC: 오래된순, DESC: 최신순) - 기본값: DESC"
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 페이지 번호 (0부터 시작)
        required: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: 페이지 크기
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
              examples:
                products/new:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"content\":[{\"id\":1,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"루즈핏 티셔츠\",\"mainImageUrl\":\"http://example.com/main1.jpg\"\
                    ,\"hoverImageUrl\":\"http://example.com/hover1.jpg\",\"originalPrice\"\
                    :50000,\"sellingPrice\":40000,\"discountRate\":20,\"colorCodes\"\
                    :[\"#000000\",\"#FFFFFF\"]},{\"id\":2,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"오버핏 니트\",\"mainImageUrl\":\"http://example.com/main2.jpg\"\
                    ,\"hoverImageUrl\":null,\"originalPrice\":39000,\"sellingPrice\"\
                    :39000,\"discountRate\":null,\"colorCodes\":[\"#8B5A2B\"]}],\"\
                    pageNumber\":0,\"pageSize\":8,\"totalElements\":2,\"totalPages\"\
                    :1,\"last\":true}}"
                products/new-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"content\":[],\"pageNumber\":0,\"pageSize\":8,\"\
                    totalElements\":0,\"totalPages\":0,\"last\":true}}"
  /v1/products/{productId}:
    get:
      tags:
      - Product
      summary: 상품 상세 조회
      description: "상품 ID로 상세 정보를 조회합니다. 갤러리 이미지, 색상/사이즈 옵션, 할인 정보가 포함됩니다."
      operationId: products/detail
      parameters:
      - name: productId
        in: path
        description: 상품 ID
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetailResponse'
              examples:
                products/detail:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"id\":1,\"categoryName\":\"TOP\",\"productName\"\
                    :\"루즈핏 티셔츠\",\"simpleDescription\":\"편안한 루즈핏 티셔츠\",\"mainImageUrl\"\
                    :\"http://example.com/main1.jpg\",\"originalPrice\":50000,\"sellingPrice\"\
                    :40000,\"discountRate\":20,\"gallery\":[{\"imageUrl\":\"http://example.com/detail1.jpg\"\
                    ,\"imageOrder\":1},{\"imageUrl\":\"http://example.com/detail2.jpg\"\
                    ,\"imageOrder\":2}],\"descriptionHtml\":\"<p>상품 상세 설명</p>\",\"\
                    options\":[{\"color\":\"블랙\",\"colorCode\":\"#000000\",\"sizes\"\
                    :[{\"size\":\"S\",\"stock\":10,\"soldOut\":false},{\"size\":\"\
                    M\",\"stock\":0,\"soldOut\":true}]},{\"color\":\"화이트\",\"colorCode\"\
                    :\"#FFFFFF\",\"sizes\":[{\"size\":\"S\",\"stock\":5,\"soldOut\"\
                    :false}]}]}}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                products/detail-not-found:
                  value: "{\"success\":false,\"status\":404,\"message\":\"존재하지 않는\
                    \ 상품입니다.\",\"data\":null}"
  /v1/sms/send:
    post:
      tags:
      - SMS
      summary: SMS 인증번호 발송
      description: 입력한 전화번호로 6자리 인증번호를 발송합니다. 이미 가입된 전화번호는 사용할 수 없습니다.
      operationId: sms/send-auth-code
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/SmsSendRequest'
            examples:
              sms/send-auth-code:
                value: "{\"phoneNumber\":\"010-1234-5678\"}"
              sms/send-auth-code-duplicate:
                value: "{\"phoneNumber\":\"010-1234-5678\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsSendResponse'
              examples:
                sms/send-auth-code:
                  value: "{\"success\":true,\"status\":201,\"message\":\"생성에 성공하였습\
                    니다.\",\"data\":{\"authCode\":\"123456\"}}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sms/send-auth-code-duplicate:
                  value: "{\"success\":false,\"status\":409,\"message\":\"이미 사용 중인\
                    \ 핸드폰 번호입니다.\",\"data\":null}"
  /v1/sms/verify:
    post:
      tags:
      - SMS
      summary: SMS 인증번호 검증
      description: 발송된 인증번호가 올바른지 검증합니다. 인증 성공 시 이후 회원 가입이 가능합니다.
      operationId: sms/verify-auth-code
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/SmsVerifyRequest'
            examples:
              sms/verify-auth-code:
                value: "{\"phoneNumber\":\"010-1234-5678\",\"authCode\":\"123456\"\
                  }"
              sms/verify-auth-code-expired:
                value: "{\"phoneNumber\":\"010-1234-5678\",\"authCode\":\"123456\"\
                  }"
              sms/verify-auth-code-mismatch:
                value: "{\"phoneNumber\":\"010-1234-5678\",\"authCode\":\"000000\"\
                  }"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                sms/verify-auth-code:
                  value: "{\"success\":true,\"status\":200,\"message\":\"핸드폰 인증에 성\
                    공하였습니다.\",\"data\":null}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sms/verify-auth-code-expired:
                  value: "{\"success\":false,\"status\":401,\"message\":\"인증번호가 만료\
                    되었거나 일치하지 않습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sms/verify-auth-code-mismatch:
                  value: "{\"success\":false,\"status\":400,\"message\":\"인증번호 코드가\
                    \ 일치하지 않습니다.\",\"data\":null}"
  /v1/tokens/reissues:
    post:
      tags:
      - Auth
      summary: 토큰 재발급
      description: Refresh 토큰 쿠키를 이용해 새로운 Access 토큰과 Refresh 토큰을 재발급합니다. 새로운 Refresh
        토큰은 Set-Cookie 헤더로 반환됩니다.
      operationId: auth/reissue-tokens
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueTokenResponse'
              examples:
                auth/reissue-tokens:
                  value: "{\"success\":true,\"status\":201,\"message\":\"생성에 성공하였습\
                    니다.\",\"data\":{\"grantType\":\"Bearer\",\"accessToken\":\"new-access-token\"\
                    ,\"refreshToken\":null}}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                auth/reissue-tokens-expired:
                  value: "{\"success\":false,\"status\":401,\"message\":\"만료된 토큰입니\
                    다.\",\"data\":null}"
                auth/reissue-tokens-invalid:
                  value: "{\"success\":false,\"status\":401,\"message\":\"유효하지 않은\
                    \ 토큰입니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                auth/reissue-tokens-missing-cookie:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null}"
  /v1/products/category/{categoryId}:
    get:
      tags:
      - Product
      summary: 카테고리별 상품 전체 페이지 조회
      description: 카테고리별 상품 전체 페이지를 조회합니다. 정렬 기준과 방향을 지정할 수 있으며 기본값은 신상품순(최신순)입니다.
      operationId: products/category
      parameters:
      - name: categoryId
        in: path
        description: 카테고리 ID
        required: true
        schema:
          type: integer
          format: int32
      - name: sortType
        in: query
        description: "정렬 기준 (NEW: 신상품순, LATEST: 최신순, NAME: 상품명순, PRICE: 가격순, POPULAR:\
          \ 인기순) - 기본값: NEW"
        required: true
        schema:
          type: string
      - name: direction
        in: query
        description: "정렬 방향 (ASC: 오름차순, DESC: 내림차순) - 기본값: DESC"
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 페이지 번호 (0부터 시작)
        required: true
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: 페이지 크기
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
              examples:
                products/category:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"content\":[{\"id\":1,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"루즈핏 티셔츠\",\"mainImageUrl\":\"http://example.com/main1.jpg\"\
                    ,\"hoverImageUrl\":\"http://example.com/hover1.jpg\",\"originalPrice\"\
                    :50000,\"sellingPrice\":40000,\"discountRate\":20,\"colorCodes\"\
                    :[\"#000000\",\"#FFFFFF\"]},{\"id\":2,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"오버핏 니트\",\"mainImageUrl\":\"http://example.com/main2.jpg\"\
                    ,\"hoverImageUrl\":null,\"originalPrice\":39000,\"sellingPrice\"\
                    :39000,\"discountRate\":null,\"colorCodes\":[\"#8B5A2B\"]}],\"\
                    pageNumber\":0,\"pageSize\":8,\"totalElements\":2,\"totalPages\"\
                    :1,\"last\":true}}"
                products/category-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"content\":[],\"pageNumber\":0,\"pageSize\":8,\"\
                    totalElements\":0,\"totalPages\":0,\"last\":true}}"
  /v1/products/main/new:
