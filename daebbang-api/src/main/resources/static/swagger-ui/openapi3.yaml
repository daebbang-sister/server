  /v1/users/check/id:
    get:
      tags:
      - User
      summary: 아이디 중복 확인
      description: "입력한 로그인 ID가 이미 사용 중인지 확인합니다. 사용 가능하면 200, 중복이면 409를 반환합니다."
      operationId: user/check-login-id
      parameters:
      - name: loginId
        in: query
        description: 중복 확인할 로그인 ID (4~16자)
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                user/check-login-id:
                  value: "{\"success\":true,\"status\":200,\"message\":\"사용 가능한 아이\
                    디입니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user/check-login-id-blank:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"loginId\",\"message\"\
                    :\"아이디는 4자에서 16자 사이여야 합니다.\"},{\"field\":\"loginId\",\"message\"\
                    :\"아이디는 비어있어서는 안됩니다.\"}]}"
                user/check-login-id-invalid:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"loginId\",\"message\"\
                    :\"아이디는 4자에서 16자 사이여야 합니다.\"}]}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user/check-login-id-duplicate:
                  value: "{\"success\":false,\"status\":409,\"message\":\"이미 사용 중인\
                    \ 아이디입니다.\",\"data\":null}"
  /v1/users/find/id:
    get:
      tags:
      - UserInfo
      summary: 아이디 찾기
      description: 이름과 이메일로 마스킹 처리된 로그인 아이디 목록을 조회합니다.
      operationId: user-info/find-login-id
      parameters:
      - name: username
        in: query
        description: 회원 이름
        required: true
        schema:
          type: string
      - name: userEmail
        in: query
        description: 이메일 주소
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindUserIdResponse'
              examples:
                user-info/find-login-id:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"userIds\":[{\"id\":\"tes********\",\"provider\"\
                    :\"LOCAL\"}]}}"
                user-info/find-login-id-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"userIds\":[]}}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user-info/find-login-id-blank-username:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"username\",\"message\"\
                    :\"회원 이름은 필수 입력값입니다.\"}]}"
                user-info/find-login-id-invalid-email:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"userEmail\",\"message\"\
                    :\"올바른 이메일 형식을 입력해야 합니다.\"}]}"
  /v1/users/find/password:
    post:
      tags:
      - UserInfo
      summary: 비밀번호 찾기 이메일 발송
      description: "이름, 로그인 ID, 이메일로 본인 확인 후 비밀번호 재설정 이메일을 발송합니다."
      operationId: user-info/find-password
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/FindPasswordRequest'
            examples:
              user-info/find-password:
                value: "{\"username\":\"홍길동\",\"userId\":\"testuser123\",\"userEmail\"\
                  :\"test@example.com\"}"
              user-info/find-password-blank-username:
                value: "{\"username\":\"\",\"userId\":\"testuser123\",\"userEmail\"\
                  :\"test@example.com\"}"
              user-info/find-password-invalid-email:
                value: "{\"username\":\"홍길동\",\"userId\":\"testuser123\",\"userEmail\"\
                  :\"invalid-email\"}"
              user-info/find-password-invalid-user-id:
                value: "{\"username\":\"홍길동\",\"userId\":\"abc\",\"userEmail\":\"\
                  test@example.com\"}"
              user-info/find-password-not-found:
                value: "{\"username\":\"홍길동\",\"userId\":\"testuser123\",\"userEmail\"\
                  :\"test@example.com\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                user-info/find-password:
                  value: "{\"success\":true,\"status\":201,\"message\":\"이메일 전송에 성\
                    공하였습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user-info/find-password-blank-username:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"username\",\"message\"\
                    :\"회원 이름은 비어있어서는 안됩니다.\"}]}"
                user-info/find-password-invalid-email:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"userEmail\",\"message\"\
                    :\"올바른 이메일 형식을 입력해야 합니다.\"}]}"
                user-info/find-password-invalid-user-id:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"userId\",\"message\"\
                    :\"아이디는 4자에서 16자 사이여야 합니다.\"}]}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user-info/find-password-not-found:
                  value: "{\"success\":false,\"status\":404,\"message\":\"존재하지 않는\
                    \ 사용자입니다.\",\"data\":null}"
  /v1/products/main/category/{categoryId}:
    get:
      tags:
      - Product
      summary: 메인 카테고리별 상품 조회
      description: 메인 페이지 카테고리별 상품 목록을 조회합니다. 등록일 기준 최신순으로 반환됩니다.
      operationId: products/main-category
      parameters:
      - name: categoryId
        in: path
        description: 카테고리 ID
        required: true
        schema:
          type: integer
          format: int32
      - name: limit
        in: query
        description: 조회할 상품 수
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductMainCardListResponse'
              examples:
                products/main-category:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[{\"id\":1,\"categoryName\":\"TOP\",\"productName\"\
                    :\"루즈핏 티셔츠\",\"mainImageUrl\":\"http://example.com/main1.jpg\"\
                    ,\"hoverImageUrl\":\"http://example.com/hover1.jpg\",\"originalPrice\"\
                    :50000,\"sellingPrice\":40000,\"discountRate\":20,\"colorCodes\"\
                    :[\"#000000\",\"#FFFFFF\"]},{\"id\":2,\"categoryName\":\"TOP\"\
                    ,\"productName\":\"오버핏 니트\",\"mainImageUrl\":\"http://example.com/main2.jpg\"\
                    ,\"hoverImageUrl\":null,\"originalPrice\":39000,\"sellingPrice\"\
                    :39000,\"discountRate\":null,\"colorCodes\":[\"#8B5A2B\"]}]}"
                products/main-category-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[]}"
components:
  schemas:
    ErrorResponse:
      title: ErrorResponse
      type: object
      properties:
        data:
          type: object
          description: 응답 데이터 (없음)
        success:
          type: boolean
          description: 성공 여부 (false)
        message:
          type: string
          description: 오류 메시지
        errors:
          type: array
          description: 필드 유효성 검증 오류 목록
          items:
            type: object
            properties:
              field:
                type: string
                description: 오류 필드명
              message:
                type: string
                description: 오류 메시지
        status:
          type: number
          description: HTTP 상태 코드 (400)
    SmsVerifyRequest:
      title: SmsVerifyRequest
      type: object
      properties:
        authCode:
          type: string
          description: 수신한 6자리 인증번호
        phoneNumber:
          type: string
          description: 인증번호를 받은 전화번호
    SmsSendRequest:
      title: SmsSendRequest
      type: object
      properties:
        phoneNumber:
          type: string
          description: "인증번호를 받을 전화번호 (예: 010-1234-5678, 형식: 010-XXXX-XXXX)"
    ReissueTokenResponse:
      title: ReissueTokenResponse
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: 새로 발급된 Access 토큰
            grantType:
              type: string
              description: 토큰 타입 (Bearer)
            refreshToken:
              type: object
              description: "Refresh 토큰 (응답 바디에는 포함되지 않음, Set-Cookie로 전달)"
          description: 토큰 정보
        success:
          type: boolean
          description: 성공 여부
        message:
          type: string
          description: 응답 메시지
        status:
          type: number
          description: HTTP 상태 코드
    ProductMainCardListResponse:
      title: ProductMainCardListResponse
      type: object
      properties:
        data:
          type: array
          description: 신상품 목록 (빈 배열)
          items:
            type: object
            properties:
              colorCodes:
                type: array
                description: 색상 코드 목록
                items:
                  oneOf:
                  - type: object
                  - type: boolean
                  - type: string
                  - type: number
              discountRate:
                type: object
                description: 할인율 % (할인 없을 시 null)
              sellingPrice:
                type: number
                description: 판매가 (할인 미적용 시 정가와 동일)
              originalPrice:
                type: number
                description: 정가
              id:
                type: number
                description: 상품 ID
              hoverImageUrl:
                type: object
                description: 호버 이미지 URL (없을 수 있음)
              mainImageUrl:
                type: string
                description: 메인 이미지 URL
              categoryName:
                type: string
                description: 카테고리명
              productName:
                type: string
                description: 상품명
        success:
          type: boolean
          description: 성공 여부
        message:
          type: string
          description: 응답 메시지
        status:
          type: number
          description: HTTP 상태 코드
    ProductDetailResponse:
      title: ProductDetailResponse
      type: object
      properties:
        data:
          type: object
          properties:
            discountRate:
              type: object
              description: 할인율 % (할인 없을 시 null)
            sellingPrice:
              type: number
              description: 판매가
            originalPrice:
              type: number
              description: 정가
            options:
              type: array
              description: 색상 옵션 목록
              items:
                type: object
                properties:
                  sizes:
                    type: array
                    description: 사이즈 옵션 목록
                    items:
                      type: object
                      properties:
                        size:
                          type: string
                          description: 사이즈
                        stock:
                          type: number
                          description: 재고 수량
                        soldOut:
                          type: boolean
                          description: 품절 여부
                  color:
                    type: string
                    description: 색상명
                  colorCode:
                    type: string
                    description: 색상 코드
            simpleDescription:
              type: string
              description: 간단 설명
            descriptionHtml:
              type: object
              description: 상품 상세 HTML
            id:
              type: number
              description: 상품 ID
            mainImageUrl:
              type: string
              description: 메인 이미지 URL
            categoryName:
              type: string
              description: 카테고리명
            gallery:
              type: array
              description: 갤러리 이미지 목록
              items:
                type: object
                properties:
                  imageUrl:
                    type: string
                    description: 갤러리 이미지 URL
                  imageOrder:
                    type: number
                    description: 갤러리 이미지 순서
            productName:
              type: string
              description: 상품명
        success:
          type: boolean
          description: 성공 여부
        message:
          type: string
          description: 응답 메시지
        status:
          type: number
          description: HTTP 상태 코드
    FindPasswordRequest:
      title: FindPasswordRequest
      type: object
      properties:
        userEmail:
          type: string
          description: 이메일 주소
        userId:
          type: string
          description: 로그인 ID
        username:
          type: string
          description: 회원 이름
    CartUpdateRequest:
      title: CartUpdateRequest
      type: object
      properties:
        productDetailsId:
          type: number
          description: 변경할 상품 상세 ID
        quantity:
          type: number
          description: 변경할 수량
    JoinUserRequest:
      title: JoinUserRequest
      type: object
      properties:
        password:
          type: string
          description: 비밀번호
        address:
          type: object
          properties:
            zipCode:
              type: string
              description: 우편번호
            address:
              type: string
              description: 도로명 주소
            detailAddress:
              type: string
              description: 상세 주소
            alias:
              type: object
              description: 주소 별칭 (null 가능)
          description: 회원 주소 정보 (null 가능)
        phoneNumber:
          type: string
          description: 전화번호
        loginId:
          type: string
          description: 로그인 ID
        name:
          type: string
          description: 회원 이름
        email:
          type: string
          description: 이메일 주소
    ProductPageResponse:
      title: ProductPageResponse
      type: object
      properties:
        data:
          type: object
          properties:
            pageNumber:
              type: number
