      description: "마이페이지에서 비밀번호/전화번호/이메일을 한 번에 수정합니다.\n모든 필드는 선택적이며 변경하려는 항목만 채워서\
        \ 보내면 됩니다.\n- 비밀번호: LOCAL 회원만 가능. 비밀번호와 비밀번호 확인이 일치해야 합니다.\n- 전화번호: 기존 번호와\
        \ 다른 경우에만 처리되며, /v1/sms/send/change → /v1/sms/verify 로 사전 인증 필요.\n- 이메일: 형\
        식 검증 후 그대로 갱신.\n"
      operationId: user/update-my-info
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/MyInfoUpdateRequest'
            examples:
              user/update-my-info:
                value: "{\"password\":\"NewPassword1!\",\"passwordConfirm\":\"NewPassword1!\"\
                  ,\"phoneNumber\":\"010-9999-8888\",\"email\":\"new@example.com\"\
                  }"
              user/update-my-info-invalid-password:
                value: "{\"password\":\"short\",\"passwordConfirm\":\"short\",\"phoneNumber\"\
                  :null,\"email\":null}"
              user/update-my-info-social-password:
                value: "{\"password\":\"Password1!\",\"passwordConfirm\":\"Password1!\"\
                  ,\"phoneNumber\":null,\"email\":null}"
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                user/update-my-info:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 정보 수정에\
                    \ 성공하였습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                user/update-my-info-invalid-password:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"password\",\"message\"\
                    :\"비밀번호는 8~16자이며, 영문/숫자/특수문자 중 2가지 이상을 조합해야 합니다.\"}]}"
                user/update-my-info-social-password:
                  value: "{\"success\":false,\"status\":400,\"message\":\"소셜 로그인 회\
                    원은 비밀번호를 변경할 수 없습니다.\",\"data\":null}"
