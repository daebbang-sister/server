openapi: 3.0.1
info:
  title: 대빵 언니 API 서버 API 명세서
  description: 대빵 언니 API 서버 명세서입니다.
  version: 1.0.0
servers:
- url: https://api.daebbang-sister.shop
  description: 운영 서버
- url: http://localhost:8080
  description: 로컬 개발 서버
tags: []
paths:
  /v1/addresses:
    get:
      tags:
      - Address
      summary: 주소 목록 조회
      description: 인증된 회원의 전체 주소 목록을 조회합니다.
      operationId: address/get-addresses
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressListResponse'
              examples:
                address/get-addresses:
                  value: "{\"success\":true,\"status\":200,\"message\":\"주소 목록 조회에\
                    \ 성공하였습니다.\",\"data\":[{\"addressId\":null,\"alias\":\"집\",\"\
                    receiver\":\"홍길동\",\"receiverPhoneNumber\":\"010-1234-5678\",\"\
                    zipCode\":\"12345\",\"address\":\"서울시 강남구 테헤란로\",\"detailAddress\"\
                    :\"101호\",\"isDefault\":true},{\"addressId\":null,\"alias\":\"\
                    집\",\"receiver\":\"홍길동\",\"receiverPhoneNumber\":\"010-1234-5678\"\
                    ,\"zipCode\":\"12345\",\"address\":\"서울시 강남구 테헤란로\",\"detailAddress\"\
                    :\"101호\",\"isDefault\":false}]}"
                address/get-addresses-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"주소 목록 조회에\
                    \ 성공하였습니다.\",\"data\":[]}"
    post:
      tags:
      - Address
      summary: 주소 등록
      description: "새로운 배송지를 등록합니다. 최대 5개까지 등록 가능하며, isDefault가 true이면 기존 기본 배송지가\
        \ 해제됩니다."
      operationId: address/add-address
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/AddressSaveRequest'
            examples:
              address/add-address:
                value: "{\"address\":\"서울시 강남구 테헤란로\",\"isDefault\":true,\"alias\"\
                  :\"집\",\"zipCode\":\"12345\",\"receiverPhoneNumber\":\"010-1234-5678\"\
                  ,\"receiver\":\"홍길동\",\"detailAddress\":\"101호\"}"
              address/add-address-limit-exceeded:
                value: "{\"receiver\":\"홍길동\",\"zipCode\":\"12345\",\"isDefault\"\
                  :false,\"receiverPhoneNumber\":\"010-1234-5678\",\"address\":\"서\
                  울시 강남구 테헤란로\",\"detailAddress\":\"101호\"}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResponse'
              examples:
                address/add-address:
                  value: "{\"success\":true,\"status\":201,\"message\":\"새 주소 등록에\
                    \ 성공하였습니다.\",\"data\":null}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                address/add-address-limit-exceeded:
                  value: "{\"success\":false,\"status\":409,\"message\":\"주소록은 최대\
                    \ 5개까지 등록 가능합니다.\",\"data\":null}"
  /v1/carts:
    get:
      tags:
      - Cart
      summary: 장바구니 조회
      description: 로그인한 회원의 장바구니를 커서 기반 페이지네이션으로 조회합니다. cursor 생략 시 최신 항목부터 반환합니다.
      operationId: cart/get-carts-
      parameters:
      - name: cursor
        in: query
        description: 마지막으로 조회한 cartId (첫 페이지 요청 시 생략)
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (기본값: 8)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartPageResponse'
              examples:
                cart/get-carts-first-page:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"carts\":[{\"cartId\":10,\"productId\":100,\"\
                    productDetailId\":500,\"quantity\":1,\"productName\":\"테스트 상품\"\
                    ,\"originalPrice\":30000,\"discountPrice\":30000,\"discountRate\"\
                    :null,\"color\":\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":9,\"productId\":100,\"productDetailId\":500,\"quantity\"\
                    :1,\"productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :8,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :7,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :6,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :5,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :4,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :3,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"}],\"nextCursor\"\
                    :3,\"hasNext\":true}}"
                cart/get-carts-last-page:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":{\"carts\":[{\"cartId\":3,\"productId\":100,\"\
                    productDetailId\":500,\"quantity\":1,\"productName\":\"테스트 상품\"\
                    ,\"originalPrice\":30000,\"discountPrice\":30000,\"discountRate\"\
                    :null,\"color\":\"블랙\",\"size\":\"M\",\"mainImageUrl\":\"https://example.com/image.jpg\"\
                    },{\"cartId\":2,\"productId\":100,\"productDetailId\":500,\"quantity\"\
                    :1,\"productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"},{\"cartId\"\
                    :1,\"productId\":100,\"productDetailId\":500,\"quantity\":1,\"\
                    productName\":\"테스트 상품\",\"originalPrice\":30000,\"discountPrice\"\
                    :30000,\"discountRate\":null,\"color\":\"블랙\",\"size\":\"M\",\"\
                    mainImageUrl\":\"https://example.com/image.jpg\"}],\"nextCursor\"\
                    :null,\"hasNext\":false}}"
    post:
      tags:
      - Cart
      summary: 장바구니 추가
      description: 장바구니에 상품을 추가합니다. 이미 담긴 상품이면 수량을 합산합니다. 단건 또는 다건 모두 리스트 형태로 전달합니다.
      operationId: cart/save-carts
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/CartSaveRequest'
            examples:
              cart/save-carts:
                value: "[{\"productDetailId\":1,\"quantity\":2}]"
              cart/save-carts-invalid-quantity:
                value: "[{\"productDetailId\":1,\"quantity\":0}]"
              cart/save-carts-multiple:
                value: "[{\"productDetailId\":1,\"quantity\":2},{\"productDetailId\"\
                  :2,\"quantity\":1},{\"productDetailId\":3,\"quantity\":3}]"
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/save-carts:
                  value: "{\"success\":true,\"status\":201,\"message\":\"장바구니 추가에\
                    \ 성공하였습니다.\",\"data\":null}"
                cart/save-carts-multiple:
                  value: "{\"success\":true,\"status\":201,\"message\":\"장바구니 추가에\
                    \ 성공하였습니다.\",\"data\":null}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cart/save-carts-invalid-quantity:
                  value: "{\"success\":false,\"status\":400,\"message\":\"잘못된 입력값입\
                    니다.\",\"data\":null,\"errors\":[{\"field\":\"quantity\",\"message\"\
                    :\"수량은 최소 한 개 이상 선택해야 합니다.\"}]}"
    delete:
      tags:
      - Cart
      summary: 장바구니 선택 삭제
      description: 선택한 장바구니 항목들을 삭제합니다. 본인 소유 항목만 삭제됩니다.
      operationId: cart/delete-carts
      parameters:
      - name: ids
        in: query
        description: "삭제할 장바구니 항목 ID 목록 (반복 파라미터, 예: ?ids=1&ids=2, 1개 이상)"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                cart/delete-carts:
                  value: "{\"success\":true,\"status\":200,\"message\":\"장바구니 삭제에\
                    \ 성공하였습니다.\",\"data\":null}"
  /v1/categories:
    get:
      tags:
      - Category
      summary: 전체 카테고리 계층 조회
      description: 상위 카테고리와 하위 카테고리를 계층 구조로 반환합니다. 단일 API 호출로 전체 카테고리 트리를 반환합니다.
      operationId: categories/list-0
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
              examples:
                categories/list-01-success:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[{\"id\":1,\"categoryName\":\"상의\",\"children\"\
                    :[{\"id\":3,\"categoryName\":\"반팔\",\"children\":[]},{\"id\":4,\"\
                    categoryName\":\"긴팔\",\"children\":[]}]},{\"id\":2,\"categoryName\"\
                    :\"하의\",\"children\":[{\"id\":5,\"categoryName\":\"청바지\",\"children\"\
                    :[]}]}]}"
                categories/list-02-empty:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[]}"
                categories/list-03-no-children:
                  value: "{\"success\":true,\"status\":200,\"message\":\"조회에 성공하였습\
                    니다.\",\"data\":[{\"id\":1,\"categoryName\":\"상의\",\"children\"\
                    :[]}]}"
  /v1/logout:
    delete:
      tags:
      - Auth
      summary: 로그아웃
      description: "로그아웃 요청 시 access token 블랙리스트 등록, refresh token Redis 삭제, refresh\
        \ 쿠키 만료 처리가 수행됩니다."
      operationId: auth/logout
      responses:
        "200":
          description: "200"
          content:
            application/json;charset=UTF-8:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                auth/logout:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
                auth/logout-no-access-token:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
                auth/logout-no-refresh-cookie:
                  value: "{\"success\":true,\"status\":200,\"message\":\"로그아웃에 성공하\
                    였습니다.\",\"data\":null}"
  /v1/orders:
    get:
      tags:
      - Order
      summary: 주문 목록 조회
      description: "로그인한 사용자의 주문 목록을 페이징하여 반환합니다.\n기본 조회 범위는 최근 3개월이며 최대 1년까지 조회 가\
        능합니다.\nstartDate를 1년 이전으로 지정하면 자동으로 1년 전으로 보정됩니다.\n날짜 형식: yyyy-MM-dd\n"
      operationId: order/list-
      parameters:
      - name: startDate
        in: query
        description: "조회 시작일 (yyyy-MM-dd, 기본값: 오늘 - 3개월, 최대 1년 전)"
        required: false
        schema:
          type: string
      - name: endDate
        in: query
        description: "조회 종료일 (yyyy-MM-dd, 기본값: 오늘)"
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: "페이지 번호 (0부터 시작, 기본값: 0)"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "페이지 크기 (기본값: 10)"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
              examples:
                order/list-success:
                  value: "{\"success\":true,\"status\":200,\"message\":\"주문 목록 조회에\
                    \ 성공하였습니다.\",\"data\":{\"content\":[{\"orderNumber\":\"20260416-ABC1234567\"\
                    ,\"orderStatus\":\"PAID\",\"orderedAt\":\"2026-04-16T10:00:00\"\
                    ,\"paymentAmount\":33000,\"totalQuantity\":2,\"representativeProductName\"\
                    :\"슬림핏 청바지\",\"representativeImageUrl\":\"https://cdn.daebbang.com/img/slim-jeans.jpg\"\
                    ,\"representativeColor\":\"골드\",\"representativeSize\":\"M\",\"\
                    representativeUnitPrice\":30000,\"representativeQuantity\":1}],\"\
                    empty\":false,\"first\":true,\"last\":true,\"number\":0,\"numberOfElements\"\
                    :1,\"pageable\":{\"offset\":0,\"pageNumber\":0,\"pageSize\":10,\"\
                    paged\":true,\"sort\":{\"empty\":true,\"sorted\":false,\"unsorted\"\
                    :true},\"unpaged\":false},\"size\":10,\"sort\":{\"empty\":true,\"\
                    sorted\":false,\"unsorted\":true},\"totalElements\":1,\"totalPages\"\
                    :1}}"
                order/list-with-date-range:
                  value: "{\"success\":true,\"status\":200,\"message\":\"주문 목록 조회에\
                    \ 성공하였습니다.\",\"data\":{\"content\":[],\"empty\":true,\"first\"\
                    :true,\"last\":true,\"number\":0,\"numberOfElements\":0,\"pageable\"\
                    :\"INSTANCE\",\"size\":0,\"sort\":{\"empty\":true,\"sorted\":false,\"\
                    unsorted\":true},\"totalElements\":0,\"totalPages\":1}}"
  /v1/reviews:
    post:
      tags:
      - Review
      summary: 리뷰 작성
      description: "주문 완료된 상품에 대해 리뷰를 작성합니다. multipart/form-data 형식.\n- data (application/json):\
        \ 리뷰 정보 JSON\n- images (binary[], 선택, 최대 4장): 첨부 이미지 (jpg/jpeg/png/webp)\n\
        - 이미지 없으면 일반 리뷰, 1장 이상이면 포토 리뷰 적립금 적용\n- 적립금은 초기 대기 상태로 등록됨\n"
      operationId: review/create-review-
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewCreatedResponse'
              examples:
                review/create-review-normal:
                  value: "{\"success\":true,\"status\":201,\"message\":\"리뷰가 등록되었습\
                    니다.\",\"data\":null}"
                review/create-review-photo:
                  value: "{\"success\":true,\"status\":201,\"message\":\"리뷰가 등록되었습\
                    니다.\",\"data\":null}"
  /v1/users:
    get:
      tags:
      - User
      summary: 회원 정보 조회 (기본 주소 없음)
      description: JWT 토큰으로 인증된 회원의 정보를 조회합니다. 기본 배송지가 없을 경우 defaultAddress는 null입니다.
      operationId: user/get-user-
      parameters:
      - name: Authorization
        in: header
        description: Bearer JWT 토큰
        required: true
        schema:
          type: string
        example: Bearer test-jwt-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              examples:
                user/get-user-no-address:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"id\":null,\"provider\":\"LOCAL\",\"loginId\"\
                    :\"testuser\",\"userName\":\"홍길동\",\"userEmail\":\"test@example.com\"\
                    ,\"userPhoneNumber\":\"010-****-5678\",\"createdAt\":null,\"lastLoginAt\"\
                    :null,\"defaultAddress\":null}}"
                user/get-user-with-address:
                  value: "{\"success\":true,\"status\":200,\"message\":\"회원 조회에 성공\
                    하였습니다.\",\"data\":{\"id\":null,\"provider\":\"LOCAL\",\"loginId\"\
                    :\"testuser\",\"userName\":\"홍길동\",\"userEmail\":\"test@example.com\"\
                    ,\"userPhoneNumber\":\"010-****-5678\",\"createdAt\":null,\"lastLoginAt\"\
                    :null,\"defaultAddress\":{\"addressId\":null,\"alias\":\"집\",\"\
                    receiver\":\"홍길동\",\"receiverPhoneNumber\":\"010-1234-5678\",\"\
                    zipCode\":\"12345\",\"address\":\"서울시 강남구 테헤란로\",\"detailAddress\"\
                    :\"101호\"}}}"
    post:
      tags:
      - User
      summary: 회원 가입
      description: 새로운 회원을 등록합니다. 전화번호 인증 완료 후 가입이 가능합니다.
      operationId: user/join-user
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: '#/components/schemas/JoinUserRequest'
            examples:
              user/join-user:
                value: "{\"name\":\"홍길동\",\"loginId\":\"testuser123\",\"password\"\
                  :\"Password123!\",\"phoneNumber\":\"010-1234-5678\",\"email\":\"\
                  test@example.com\",\"address\":{\"alias\":null,\"zipCode\":\"123-4567\"\
                  ,\"address\":\"테스트시 테스트구 테스트동\",\"detailAddress\":\"테스트 오피스텔 2층\"\
                  }}"
              user/join-user-invalid-login-id:
                value: "{\"name\":\"홍길동\",\"loginId\":\"TestUser123\",\"password\"\
                  :\"Password123!\",\"phoneNumber\":\"010-1234-5678\",\"email\":\"\
                  test@example.com\",\"address\":{\"alias\":null,\"zipCode\":\"123-4567\"\
                  ,\"address\":\"테스트시 테스트구 테스트동\",\"detailAddress\":\"테스트 오피스텔 2층\"\
                  }}"
      responses:
        "201":
          description: "201"
          content:
            application/json:
