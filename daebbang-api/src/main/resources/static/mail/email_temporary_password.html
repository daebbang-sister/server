<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAEBBANGSISTER</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f6f9fc;
      font-family:
        &quot;Pretendard&quot;,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        Roboto,
        &quot;Noto Sans KR&quot;,
        &quot;Apple SD Gothic Neo&quot;,
        &quot;Malgun Gothic&quot;,
        Arial,
        sans-serif;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #f6f9fc; padding: 20px 0"
    >
      <tr>
        <td align="center">
          <!-- container -->
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 600px;
              background-color: #ffffff;
              border-radius: 12px;
              box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            "
          >
            <!-- Header -->
            <tr>
              <td
                align="center"
                style="
                  background: #1b1f27;
                  padding: 28px 0;
                  border-radius: 12px 12px 0 0;
                "
              >
                <h2
                  style="
                    margin: 0;
                    color: #fce337;
                    font-size: 24px;
                    letter-spacing: 1px;
                    font-weight: 700;
                  "
                >
                  DAEBBANGSISTER
                </h2>
              </td>
            </tr>

            <!-- Message -->
            <tr>
              <td
                style="
                  padding: 32px 40px 8px 40px;
                  color: #1b1f27;
                  font-size: 16px;
                  line-height: 1.6;
                  word-break: keep-all;
                "
              >
                안녕하세요. <br />
                쇼핑몰 대빵언니 입니다.<br />
                요청하신 <strong>임시 비밀번호</strong>를 안내드립니다.<br />
                로그인 후 마이페이지에서 반드시 비밀번호를 변경해 주세요.
              </td>
            </tr>

            <!-- Password Card -->
            <tr>
              <td align="center" style="padding: 16px 40px 36px 40px">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  style="
                    width: 100%;
                    max-width: 420px;
                    background: #f7f8fa;
                    border-radius: 10px;
                  "
                >
                  <tr>
                    <td
                      style="padding: 20px 20px 22px 20px; position: relative"
                    >
                      <!-- label -->
                      <div
                        style="
                          font-size: 12px;
                          color: #8b9098;
                          margin-bottom: 6px;
                        "
                      >
                        임시 비밀번호
                      </div>

                      <!-- password -->
                      <div
                        id="tempPassword"
                        style="
                          font-size: 22px;
                          font-weight: 700;
                          color: #1b1f27;
                          letter-spacing: 2px;
                          word-break: break-all;
                        "
                      >
                        {temporary_password}
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- CTA Button -->
            <tr>
              <td align="center" style="padding: 0 0 44px 0">
                <a
                  href="https://daebbang-sister.shop"
                  style="
                    display: inline-block;
                    padding: 18px 44px;
                    background: #1b1f27;
                    color: #fce337;
                    text-decoration: none;
                    border-radius: 8px;
                    font-size: 16px;
                    font-weight: 700;
                  "
                >
                  사이트 이동
                </a>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td
                style="
                  padding: 22px 40px;
                  font-size: 12px;
                  color: #999999;
                  text-align: center;
                  border-top: 1px solid #eee;
                  border-radius: 0 0 12px 12px;
                  line-height: 1.6;
                "
              >
                감사합니다.<br />
                <strong>DAEBBANGSISTER 팀</strong><br /><br />
                본 메일은 발신 전용입니다.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
