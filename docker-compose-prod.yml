services:
  nginx:
    image: nginx:alpine
    container_name: api-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./ssl/conf:/etc/letsencrypt
    networks:
      - daebbang-api
    depends_on:
      - api-server

  api-server:
    image: ${DOCKERHUB_USERNAME}/daebbang-server:api-latest
    container_name: api-server
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=api-db
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}

      - REDIS_HOST=api-redis

      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
    networks:
      - daebbang-api
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: api-db
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./db/db_data:/var/lib/mysql
    networks:
      - daebbang-api

  redis:
    image: redis:alpine
    container_name: api-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./db/redis_data:/data
    networks:
      - daebbang-api

networks:
  daebbang-api:
    driver: bridge